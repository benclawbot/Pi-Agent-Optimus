name: Pi Agent harness validation

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: pi-harness-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness:
    name: Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run harness and behavioral security regression tests
        run: npm test
      - name: Verify clean install and upgrade without touching user home
        run: node scripts/verify-fresh-install.mjs
